<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Ứng Cứu Sự Cố (Fixed)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React và React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel để compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Mock icons với emoji thay vì Lucide
        const Icons = {
            Flame: () => <span className="text-red-500">🔥</span>,
            ShieldAlert: () => <span className="text-blue-500">🛡️</span>,
            AlertTriangle: () => <span className="text-orange-500">⚠️</span>,
            MapPin: () => <span className="text-slate-400">📍</span>,
            List: () => <span>📋</span>,
            Search: () => <span>🔍</span>,
            Clock: () => <span>🕐</span>,
            Phone: () => <span>📞</span>,
            Map: () => <span>🗺️</span>
        };

        // Data
        const incidents = [
          {
            id: "PNJ.FIRE.001",
            branch: "Chi nhánh A",
            address: "Tòa nhà A, 123 Đường XYZ",
            type: "Cháy",
            priority: 1,
            status: "Cảnh báo Khẩn cấp",
            time: "2025-08-24 10:45",
            members: [
              { name: "Đội trưởng A", phone: "0901234567", pttId: "PTT-101", role: "Chỉ huy" },
              { name: "Kỹ thuật B", phone: "0902223344", pttId: "PTT-102", role: "Kỹ thuật" },
            ],
          },
          {
            id: "PNJ.SECU.001",
            branch: "Chi nhánh A",
            address: "Tòa nhà A, 123 Đường XYZ",
            type: "An ninh",
            priority: 2,
            status: "Đã xử lý",
            time: "2025-08-24 09:05",
            members: [
              { name: "Bảo vệ E", phone: "0903334455", pttId: "PTT-201", role: "Bảo vệ" },
            ],
          },
          {
            id: "PNJ.SOS.001",
            branch: "Chi nhánh B",
            address: "Tòa nhà B, 456 Đường ABC",
            type: "SOS",
            priority: 1,
            status: "Đang xử lý",
            time: "2025-08-24 11:20",
            members: [
              { name: "Y tế G", phone: "0909998877", pttId: "PTT-301", role: "Y tế" },
            ],
          },
          {
            id: "PNJ.TECH.001",
            branch: "Chi nhánh C",
            address: "Tòa nhà C, 789 Đường DEF",
            type: "Kỹ thuật",
            priority: 3,
            status: "Đang xử lý",
            time: "2025-08-24 08:30",
            members: [
              { name: "Kỹ thuật I", phone: "0907778899", pttId: "PTT-401", role: "Kỹ thuật" },
            ],
          },
        ];

        // Helper functions
        const getTypeIcon = (type) => {
          switch (type) {
            case "Cháy": return <Icons.Flame />;
            case "An ninh": return <Icons.ShieldAlert />;
            case "SOS": return <Icons.AlertTriangle />;
            case "Kỹ thuật": return <Icons.AlertTriangle />;
            default: return <Icons.AlertTriangle />;
          }
        };

        const getTypeColor = (type) => {
          switch (type) {
            case "Cháy": return "bg-red-100 text-red-800";
            case "An ninh": return "bg-blue-100 text-blue-800";
            case "SOS": return "bg-orange-100 text-orange-800";
            case "Kỹ thuật": return "bg-gray-100 text-gray-800";
            default: return "bg-gray-100 text-gray-800";
          }
        };

        const getStatusColor = (status) => {
          switch (status) {
            case "Cảnh báo Khẩn cấp": return "bg-red-100 text-red-800";
            case "Đang xử lý": return "bg-yellow-100 text-yellow-800";
            case "Đã xử lý": return "bg-green-100 text-green-800";
            default: return "bg-gray-100 text-gray-800";
          }
        };

        const getPriorityColor = (priority) => {
          switch (priority) {
            case 1: return "bg-red-600";
            case 2: return "bg-yellow-500";
            case 3: return "bg-green-500";
            default: return "bg-gray-400";
          }
        };

        // Components
        const ContactCell = ({ members }) => {
          if (!members || members.length === 0) {
            return <span className="text-slate-400">—</span>;
          }

          const firstMember = members[0];
          const remainingCount = members.length - 1;

          return (
            <div className="space-y-1">
              <div className="flex items-center gap-2">
                <Icons.Phone />
                <span className="text-xs font-medium">{firstMember.name}</span>
                <span className="text-xs text-slate-500">({firstMember.role})</span>
              </div>
              <div className="text-xs text-slate-500">{firstMember.phone}</div>
              {remainingCount > 0 && (
                <div className="text-xs text-blue-600">+{remainingCount} người khác</div>
              )}
            </div>
          );
        };

        // Main component
        function IncidentDashboard() {
          const [searchTerm, setSearchTerm] = useState("");
          const [typeFilter, setTypeFilter] = useState("Tất cả");
          const [statusFilter, setStatusFilter] = useState("Tất cả");
          const [viewMode, setViewMode] = useState("list");

          const filtered = useMemo(() => {
            return incidents.filter((incident) => {
              const matchesSearch = 
                incident.branch.toLowerCase().includes(searchTerm.toLowerCase()) ||
                incident.address.toLowerCase().includes(searchTerm.toLowerCase()) ||
                incident.id.toLowerCase().includes(searchTerm.toLowerCase());
              
              const matchesType = typeFilter === "Tất cả" || incident.type === typeFilter;
              const matchesStatus = statusFilter === "Tất cả" || incident.status === statusFilter;
              
              return matchesSearch && matchesType && matchesStatus;
            });
          }, [searchTerm, typeFilter, statusFilter]);

          return (
            <div className="min-h-screen bg-slate-50 p-6">
              <div className="mx-auto max-w-7xl">
                {/* Header */}
                <div className="mb-8 rounded-xl bg-white p-6 shadow-sm">
                  <div className="flex items-center justify-between">
                    <div>
                      <h1 className="text-2xl font-bold text-slate-900">🔥 Ứng Cứu Sự Cố</h1>
                      <p className="mt-1 text-sm text-slate-600">Hệ thống quản lý và điều phối sự vụ khẩn cấp</p>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="flex items-center gap-2 text-sm text-slate-600">
                        <Icons.Clock />
                        <span>{new Date().toLocaleString('vi-VN')}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Filters */}
                <div className="mb-6 rounded-xl bg-white p-6 shadow-sm">
                  <div className="grid grid-cols-1 gap-4 md:grid-cols-4">
                    {/* Search */}
                    <div className="relative">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2">
                        <Icons.Search />
                      </div>
                      <input
                        type="text"
                        placeholder="Tìm kiếm theo chi nhánh, địa chỉ, ID..."
                        className="w-full rounded-lg border border-slate-200 pl-10 pr-4 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                    </div>

                    {/* Type filter */}
                    <select
                      className="rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      value={typeFilter}
                      onChange={(e) => setTypeFilter(e.target.value)}
                    >
                      <option value="Tất cả">Tất cả loại</option>
                      <option value="Cháy">Cháy</option>
                      <option value="An ninh">An ninh</option>
                      <option value="SOS">SOS</option>
                      <option value="Kỹ thuật">Kỹ thuật</option>
                    </select>

                    {/* Status filter */}
                    <select
                      className="rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      value={statusFilter}
                      onChange={(e) => setStatusFilter(e.target.value)}
                    >
                      <option value="Tất cả">Tất cả trạng thái</option>
                      <option value="Cảnh báo Khẩn cấp">Cảnh báo Khẩn cấp</option>
                      <option value="Đang xử lý">Đang xử lý</option>
                      <option value="Đã xử lý">Đã xử lý</option>
                    </select>

                    {/* View mode toggle */}
                    <div className="flex rounded-lg border border-slate-200 p-1">
                      <button
                        className={`flex-1 flex items-center justify-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
                          viewMode === "list" ? "bg-blue-900 text-white" : "text-slate-600 hover:text-slate-900"
                        }`}
                        onClick={() => setViewMode("list")}
                      >
                        <Icons.List />
                        Danh sách
                      </button>
                      <button
                        className={`flex-1 flex items-center justify-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
                          viewMode === "map" ? "bg-blue-900 text-white" : "text-slate-600 hover:text-slate-900"
                        }`}
                        onClick={() => setViewMode("map")}
                      >
                        <Icons.Map />
                        Bản đồ
                      </button>
                    </div>
                  </div>
                </div>

                {/* Content */}
                <div className="rounded-xl bg-white shadow-sm">
                  {viewMode === "list" ? (
                    <div className="overflow-hidden">
                      <table className="w-full">
                        <thead className="bg-slate-50">
                          <tr>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Mức độ</th>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">ID & Địa điểm</th>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Loại</th>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Trạng thái</th>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Liên hệ</th>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Thời gian</th>
                            <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Hành động</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {filtered.map((incident) => (
                            <tr key={incident.id} className="hover:bg-slate-50">
                              <td className="px-4 py-3">
                                <div className={`h-3 w-3 rounded-full ${getPriorityColor(incident.priority)}`}></div>
                              </td>
                              <td className="px-4 py-3">
                                <div>
                                  <div className="flex items-center gap-2">
                                    <Icons.MapPin />
                                    <span className="font-medium text-slate-900">{incident.id}</span>
                                  </div>
                                  <div className="text-sm text-slate-600">{incident.branch}</div>
                                  <div className="text-xs text-slate-500">{incident.address}</div>
                                </div>
                              </td>
                              <td className="px-4 py-3">
                                <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium ${getTypeColor(incident.type)}`}>
                                  {getTypeIcon(incident.type)}
                                  {incident.type}
                                </span>
                              </td>
                              <td className="px-4 py-3">
                                <span className={`inline-flex rounded-full px-2.5 py-1 text-xs font-medium ${getStatusColor(incident.status)}`}>
                                  {incident.status}
                                </span>
                              </td>
                              <td className="px-4 py-3">
                                <ContactCell members={incident.members || []} />
                              </td>
                              <td className="px-4 py-3 text-sm text-slate-600">{incident.time}</td>
                              <td className="px-4 py-3">
                                <button className="rounded-lg bg-blue-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-800">
                                  Chi tiết
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="flex h-[520px] items-center justify-center">
                      <div className="text-center">
                        <Icons.Map />
                        <p className="mt-2 text-sm text-slate-600">
                          Bản đồ sự vụ (cluster theo cơ sở) — placeholder, tích hợp GIS ở đây.
                        </p>
                      </div>
                    </div>
                  )}

                  {/* Footer */}
                  <div className="mt-4 flex items-center justify-between text-xs text-slate-500 p-4">
                    <div>
                      Tổng số sự vụ: <span className="font-semibold text-slate-700">{filtered.length}</span>
                    </div>
                    <div>Tone màu: nền trắng · nhấn xanh dương đậm · cảnh báo đỏ.</div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Render the app
        ReactDOM.render(<IncidentDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
