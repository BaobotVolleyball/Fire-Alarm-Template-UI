<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Ứng Cứu Sự Cố</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React và React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel để compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    
    <!-- Framer Motion (simplified version) -->
    <script>
        // Simplified motion component for demo
        window.motion = {
            div: (props) => React.createElement('div', {
                ...props,
                style: {
                    ...props.style,
                    transition: 'all 0.3s ease'
                }
            })
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { 
            Flame, 
            ShieldAlert, 
            AlertTriangle, 
            MapPin, 
            List, 
            Search, 
            Clock, 
            Phone, 
            Map: MapIcon 
        } = lucideReact;

        // Component code từ file JSX
        const incidents = [
          {
            id: "PNJ.FIRE.001",
            branch: "Chi nhánh A",
            address: "Tòa nhà A, 123 Đường XYZ",
            type: "Cháy",
            priority: 1,
            status: "Cảnh báo Khẩn cấp",
            time: "2025-08-24 10:45",
            members: [
              { name: "Đội trưởng A", phone: "0901234567", pttId: "PTT-101", role: "Chỉ huy" },
              { name: "Kỹ thuật B", phone: "0902223344", pttId: "PTT-102", role: "Kỹ thuật" },
              { name: "Bảo vệ C", phone: "0905556677", pttId: "PTT-103", role: "Bảo vệ" },
              { name: "Y tế D", phone: "0908889991", pttId: "PTT-104", role: "Nhân viên" },
            ],
          },
          {
            id: "PNJ.SECU.001",
            branch: "Chi nhánh A",
            address: "Tòa nhà A, 123 Đường XYZ",
            type: "An ninh",
            priority: 2,
            status: "Đã xử lý",
            time: "2025-08-24 09:05",
            members: [
              { name: "Bảo vệ E", phone: "0903334455", pttId: "PTT-201", role: "Bảo vệ" },
              { name: "Kỹ thuật F", phone: "0906667788", pttId: "PTT-202", role: "Kỹ thuật" },
            ],
          },
          {
            id: "PNJ.SOS.001",
            branch: "Chi nhánh B",
            address: "Tòa nhà B, 456 Đường ABC",
            type: "SOS",
            priority: 1,
            status: "Đang xử lý",
            time: "2025-08-24 11:20",
            members: [
              { name: "Y tế G", phone: "0909998877", pttId: "PTT-301", role: "Y tế" },
              { name: "Bảo vệ H", phone: "0904445566", pttId: "PTT-302", role: "Bảo vệ" },
            ],
          },
          {
            id: "PNJ.TECH.001",
            branch: "Chi nhánh C",
            address: "Tòa nhà C, 789 Đường DEF",
            type: "Kỹ thuật",
            priority: 3,
            status: "Đang xử lý",
            time: "2025-08-24 08:30",
            members: [
              { name: "Kỹ thuật I", phone: "0907778899", pttId: "PTT-401", role: "Kỹ thuật" },
            ],
          },
        ];

        // Helper functions
        const getTypeIcon = (type) => {
          switch (type) {
            case "Cháy": return React.createElement(Flame, { className: "h-4 w-4" });
            case "An ninh": return React.createElement(ShieldAlert, { className: "h-4 w-4" });
            case "SOS": return React.createElement(AlertTriangle, { className: "h-4 w-4" });
            case "Kỹ thuật": return React.createElement(AlertTriangle, { className: "h-4 w-4" });
            default: return React.createElement(AlertTriangle, { className: "h-4 w-4" });
          }
        };

        const getTypeColor = (type) => {
          switch (type) {
            case "Cháy": return "bg-red-100 text-red-800";
            case "An ninh": return "bg-blue-100 text-blue-800";
            case "SOS": return "bg-orange-100 text-orange-800";
            case "Kỹ thuật": return "bg-gray-100 text-gray-800";
            default: return "bg-gray-100 text-gray-800";
          }
        };

        const getStatusColor = (status) => {
          switch (status) {
            case "Cảnh báo Khẩn cấp": return "bg-red-100 text-red-800";
            case "Đang xử lý": return "bg-yellow-100 text-yellow-800";
            case "Đã xử lý": return "bg-green-100 text-green-800";
            default: return "bg-gray-100 text-gray-800";
          }
        };

        const getPriorityColor = (priority) => {
          switch (priority) {
            case 1: return "bg-red-600";
            case 2: return "bg-yellow-500";
            case 3: return "bg-green-500";
            default: return "bg-gray-400";
          }
        };

        // Components
        const ContactCell = ({ members }) => {
          if (!members || members.length === 0) {
            return React.createElement('span', { className: "text-slate-400" }, "—");
          }

          const firstMember = members[0];
          const remainingCount = members.length - 1;

          return React.createElement('div', { className: "space-y-1" },
            React.createElement('div', { className: "flex items-center gap-2" },
              React.createElement(Phone, { className: "h-3 w-3 text-slate-400" }),
              React.createElement('span', { className: "text-xs font-medium" }, firstMember.name),
              React.createElement('span', { className: "text-xs text-slate-500" }, `(${firstMember.role})`)
            ),
            React.createElement('div', { className: "text-xs text-slate-500" }, firstMember.phone),
            remainingCount > 0 && React.createElement('div', { className: "text-xs text-blue-600" }, `+${remainingCount} người khác`)
          );
        };

        // Main component
        function IncidentDashboard() {
          const [searchTerm, setSearchTerm] = useState("");
          const [typeFilter, setTypeFilter] = useState("Tất cả");
          const [statusFilter, setStatusFilter] = useState("Tất cả");
          const [viewMode, setViewMode] = useState("list");

          const filtered = useMemo(() => {
            return incidents.filter((incident) => {
              const matchesSearch = 
                incident.branch.toLowerCase().includes(searchTerm.toLowerCase()) ||
                incident.address.toLowerCase().includes(searchTerm.toLowerCase()) ||
                incident.id.toLowerCase().includes(searchTerm.toLowerCase());
              
              const matchesType = typeFilter === "Tất cả" || incident.type === typeFilter;
              const matchesStatus = statusFilter === "Tất cả" || incident.status === statusFilter;
              
              return matchesSearch && matchesType && matchesStatus;
            });
          }, [searchTerm, typeFilter, statusFilter]);

          return React.createElement('div', { className: "min-h-screen bg-slate-50 p-6" },
            React.createElement('div', { className: "mx-auto max-w-7xl" },
              // Header
              React.createElement('div', { className: "mb-8 rounded-xl bg-white p-6 shadow-sm" },
                React.createElement('div', { className: "flex items-center justify-between" },
                  React.createElement('div', null,
                    React.createElement('h1', { className: "text-2xl font-bold text-slate-900" }, "Ứng Cứu Sự Cố"),
                    React.createElement('p', { className: "mt-1 text-sm text-slate-600" }, "Hệ thống quản lý và điều phối sự vụ khẩn cấp")
                  ),
                  React.createElement('div', { className: "flex items-center gap-3" },
                    React.createElement('div', { className: "flex items-center gap-2 text-sm text-slate-600" },
                      React.createElement(Clock, { className: "h-4 w-4" }),
                      React.createElement('span', null, new Date().toLocaleString('vi-VN'))
                    )
                  )
                )
              ),

              // Filters
              React.createElement('div', { className: "mb-6 rounded-xl bg-white p-6 shadow-sm" },
                React.createElement('div', { className: "grid grid-cols-1 gap-4 md:grid-cols-4" },
                  // Search
                  React.createElement('div', { className: "relative" },
                    React.createElement(Search, { className: "absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" }),
                    React.createElement('input', {
                      type: "text",
                      placeholder: "Tìm kiếm theo chi nhánh, địa chỉ, ID...",
                      className: "w-full rounded-lg border border-slate-200 pl-10 pr-4 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500",
                      value: searchTerm,
                      onChange: (e) => setSearchTerm(e.target.value)
                    })
                  ),

                  // Type filter
                  React.createElement('select', {
                    className: "rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500",
                    value: typeFilter,
                    onChange: (e) => setTypeFilter(e.target.value)
                  },
                    React.createElement('option', { value: "Tất cả" }, "Tất cả loại"),
                    React.createElement('option', { value: "Cháy" }, "Cháy"),
                    React.createElement('option', { value: "An ninh" }, "An ninh"),
                    React.createElement('option', { value: "SOS" }, "SOS"),
                    React.createElement('option', { value: "Kỹ thuật" }, "Kỹ thuật")
                  ),

                  // Status filter
                  React.createElement('select', {
                    className: "rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500",
                    value: statusFilter,
                    onChange: (e) => setStatusFilter(e.target.value)
                  },
                    React.createElement('option', { value: "Tất cả" }, "Tất cả trạng thái"),
                    React.createElement('option', { value: "Cảnh báo Khẩn cấp" }, "Cảnh báo Khẩn cấp"),
                    React.createElement('option', { value: "Đang xử lý" }, "Đang xử lý"),
                    React.createElement('option', { value: "Đã xử lý" }, "Đã xử lý")
                  ),

                  // View mode toggle
                  React.createElement('div', { className: "flex rounded-lg border border-slate-200 p-1" },
                    React.createElement('button', {
                      className: `flex-1 flex items-center justify-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
                        viewMode === "list" ? "bg-blue-900 text-white" : "text-slate-600 hover:text-slate-900"
                      }`,
                      onClick: () => setViewMode("list")
                    },
                      React.createElement(List, { className: "h-4 w-4" }),
                      "Danh sách"
                    ),
                    React.createElement('button', {
                      className: `flex-1 flex items-center justify-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
                        viewMode === "map" ? "bg-blue-900 text-white" : "text-slate-600 hover:text-slate-900"
                      }`,
                      onClick: () => setViewMode("map")
                    },
                      React.createElement(MapIcon, { className: "h-4 w-4" }),
                      "Bản đồ"
                    )
                  )
                )
              ),

              // Content
              React.createElement('div', { className: "rounded-xl bg-white shadow-sm" },
                viewMode === "list" ? (
                  React.createElement('div', { className: "overflow-hidden" },
                    React.createElement('table', { className: "w-full" },
                      React.createElement('thead', { className: "bg-slate-50" },
                        React.createElement('tr', null,
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "Mức độ"),
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "ID & Địa điểm"),
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "Loại"),
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "Trạng thái"),
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "Liên hệ"),
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "Thời gian"),
                          React.createElement('th', { className: "px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600" }, "Hành động")
                        )
                      ),
                      React.createElement('tbody', { className: "divide-y divide-slate-200" },
                        filtered.map((incident) =>
                          React.createElement('tr', { key: incident.id, className: "hover:bg-slate-50" },
                            React.createElement('td', { className: "px-4 py-3" },
                              React.createElement('div', { className: `h-3 w-3 rounded-full ${getPriorityColor(incident.priority)}` })
                            ),
                            React.createElement('td', { className: "px-4 py-3" },
                              React.createElement('div', null,
                                React.createElement('div', { className: "flex items-center gap-2" },
                                  React.createElement(MapPin, { className: "h-4 w-4 text-slate-400" }),
                                  React.createElement('span', { className: "font-medium text-slate-900" }, incident.id)
                                ),
                                React.createElement('div', { className: "text-sm text-slate-600" }, incident.branch),
                                React.createElement('div', { className: "text-xs text-slate-500" }, incident.address)
                              )
                            ),
                            React.createElement('td', { className: "px-4 py-3" },
                              React.createElement('span', { className: `inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium ${getTypeColor(incident.type)}` },
                                getTypeIcon(incident.type),
                                incident.type
                              )
                            ),
                            React.createElement('td', { className: "px-4 py-3" },
                              React.createElement('span', { className: `inline-flex rounded-full px-2.5 py-1 text-xs font-medium ${getStatusColor(incident.status)}` },
                                incident.status
                              )
                            ),
                            React.createElement('td', { className: "px-4 py-3" },
                              React.createElement(ContactCell, { members: incident.members || [] })
                            ),
                            React.createElement('td', { className: "px-4 py-3 text-sm text-slate-600" }, incident.time),
                            React.createElement('td', { className: "px-4 py-3" },
                              React.createElement('button', { className: "rounded-lg bg-blue-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-800" }, "Chi tiết")
                            )
                          )
                        )
                      )
                    )
                  )
                ) : (
                  React.createElement('div', { className: "flex h-[520px] items-center justify-center" },
                    React.createElement('div', { className: "text-center" },
                      React.createElement(MapIcon, { className: "mx-auto h-10 w-10 text-blue-700" }),
                      React.createElement('p', { className: "mt-2 text-sm text-slate-600" }, "Bản đồ sự vụ (cluster theo cơ sở) — placeholder, tích hợp GIS ở đây.")
                    )
                  )
                ),

                // Footer
                React.createElement('div', { className: "mt-4 flex items-center justify-between text-xs text-slate-500 p-4" },
                  React.createElement('div', null,
                    "Tổng số sự vụ: ",
                    React.createElement('span', { className: "font-semibold text-slate-700" }, filtered.length)
                  ),
                  React.createElement('div', null, "Tone màu: nền trắng · nhấn xanh dương đậm · cảnh báo đỏ.")
                )
              )
            )
          );
        }

        // Render the app
        ReactDOM.render(React.createElement(IncidentDashboard), document.getElementById('root'));
    </script>
</body>
</html>
